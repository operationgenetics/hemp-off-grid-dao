[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = true
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
arbitrum = "https://arb1.arbitrum.io/rpc"
